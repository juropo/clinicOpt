<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Leaflet Map – Cities & Lines</title>

  <!-- Leaflet CSS (CORRECT TAG) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    .tooltip-title {
      font-weight: bold;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet JS (CORRECT TAG) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // ----------------------------------------------------
  // 1) Initialize map
  // ----------------------------------------------------
  const map = L.map("map").setView([40.8, -84.0], 8);

  // ----------- Pretty CARTO Light basemap -----------
  L.tileLayer(
    "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
    {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap contributors & CARTO"
    }
  ).addTo(map);

  // ----------------------------------------------------
  // 2) Load your Leaflet-friendly JSON
  // ----------------------------------------------------
  fetch("leaflet_data.json")
    .then(r => r.json())
    .then(data => {
      const cityLookup = {};

      // ------------------------------------------------
      // 3) Add City Markers
      // ------------------------------------------------
      data.cities.forEach(c => {
        const marker = L.circleMarker([c.lat, c.lon], {
          radius: c.size || 5,
          color: "black",
          weight: 1,
          fillColor: c.color || "orange",
          fillOpacity: 0.7
        });

        marker.bindTooltip(c.tooltip, {
          direction: "top",
          sticky: true
        });

        marker.addTo(map);
        cityLookup[c.city] = [c.lat, c.lon];
      });

      // ------------------------------------------------
      // 4) Add Lines Between Cities
      // ------------------------------------------------
      data.lines.forEach(l => {
        const from = cityLookup[l.from];
        const to   = cityLookup[l.to];

        if (from && to) {
          L.polyline([from, to], {
            color: "#444",
            weight: 2,
            opacity: 0.5
          }).addTo(map);
        }
      });

    })
    .catch(err => {
      console.error(err);
      alert("Error loading leaflet_data.json");
    });

</script>

</body>
</html>
